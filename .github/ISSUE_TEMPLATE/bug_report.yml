name: 🐛 Bug report
description: Report something broken in QuestLog
title: '[Bug]: '
labels:
- bug
body:
- type: input
  id: area
  attributes:
    label: Affected area
    description: e.g. Quest list, XP / gamification, Paywall & subscriptions (RevenueCat)
  validations:
    required: true
- type: textarea
  id: what
  attributes:
    label: What happened?
    description: What did you expect, and what happened instead?
  validations:
    required: true
- type: textarea
  id: steps
  attributes:
    label: Steps to reproduce
    placeholder: "1. \n2. \n3. "
  validations:
    required: true
- type: dropdown
  id: platform
  attributes:
    label: Platform
    multiple: true
    options:
    - Android
    - iOS
    - Web
    - Expo Go
- type: textarea
  id: logs
  attributes:
    label: Logs or screenshots
    description: Remove keys, tokens and personal data first.
    render: shell
